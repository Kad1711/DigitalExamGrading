name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-ai:
    name: AI Service (FastAPI & OMR Tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install system dependencies for OpenCV & PyMuPDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: |
          pytest -v

  test-api:
    name: Backend API (Express & Node.js Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: exam_user
          POSTGRES_PASSWORD: exam_local_2026
          POSTGRES_DB: exam_grading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize Prisma Client & Test Database
        env:
          DATABASE_URL: postgresql://exam_user:exam_local_2026@localhost:5432/exam_grading_test?schema=public
          TEST_DATABASE_URL: postgresql://exam_user:exam_local_2026@localhost:5432/exam_grading_test?schema=public
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run API test suite
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: postgresql://exam_user:exam_local_2026@localhost:5432/exam_grading_test?schema=public
          TEST_DATABASE_URL: postgresql://exam_user:exam_local_2026@localhost:5432/exam_grading_test?schema=public
          JWT_ACCESS_SECRET: test_ci_jwt_access_secret_key_1234567890
          JWT_REFRESH_SECRET: test_ci_jwt_refresh_secret_key_1234567890
          AI_SERVICE_URL: http://localhost:8000
        run: npm test

  build-web:
    name: Frontend Web (React & Vite Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linting (oxlint)
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  docker-build-check:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [test-ai, test-api, build-web]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose builds
        run: |
          docker compose build --parallel
